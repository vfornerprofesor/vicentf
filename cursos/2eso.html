<!DOCTYPE html>
<html lang="es">

<head>
    <style>
        /* Pantalla de carrega: evita el flaix de contingut sense estils
           mentre header.html (que porta tot el CSS/JS propi) encara no ha
           arribat. Colors en literal, no variables de general.css: eixe
           fitxer encara no ha carregat en este punt. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #6d5fb3;
            transition: opacity .3s ease;
        }
        #loading.vf-loading-hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .vf-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: vf-spin .8s linear infinite;
        }

        @keyframes vf-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <base href="../">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2n ESO</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

    <div id="header"></div>
    <script>$('#header').load('header.html');</script>

</head>

<body>
    <div id="loading">
        <div class="vf-spinner"></div>
    </div>
    <script>
        // Xarxa de seguretat independent de header.html: si per qualsevol
        // motiu no arriba a carregar (CDN caiguda, error de xarxa...), no
        // ens quedem amb l'espera infinita.
        setTimeout(function () {
            var l = document.getElementById('loading');
            if (l) { l.style.display = 'none'; }
        }, 5000);
    </script>
    
<div id="menu"></div>
    <script>$('#menu').load('menu.html');</script>
    <div id="content">
        <vf-title  level="1" centered styles="" classes="">
            2n ESO
        </vf-title>

        <vf-title level="2" centered>
            Situacions d'aprenentatge
        </vf-title>

       <vf-content>

            <vf-row centered>
                <vf-card link="unitats/ofimatica/full-calcul" img="assets/google_calcul.png" alt="Ofimàtica - Full de càlcul">
                    Ofimàtica - Full de càlcul
                </vf-card>
                <vf-card link="unitats/programacio/basic/pensament-computacional" img="assets/pensament-computacional.jpg" alt="Pensament Computacional">
                    Pensament Computacional
                </vf-card>
                <vf-card link="unitats/programacio/blocs/scratch" img="assets/scratch.png" alt="Scratch">
                    Scratch
                </vf-card>
                <vf-card link="unitats/inteligencia-artificial/inteligencia-artificial" img="assets/inteligencia_artificial.jpeg" alt="Conceptes bàsics IA">
                    Conceptes bàsics IA
                </vf-card>
                <vf-card link="unitats/programacio/robotica/microbit" img="assets/microbit.jpg" alt="Robòtica">
                    Robòtica
                </vf-card>
                <vf-card link="unitats/multimedia/edicio-imatge-1" img="assets/gimp.png" alt="Edició d'imatge GIMP - Bàsic">
                    Edició d'imatge GIMP - Bàsic
                </vf-card>
            </vf-row>

        </vf-content>

    </div>
    <div id="footer"></div>
    <script>$('#footer').load('footer.html');</script></div>

    
</body>

</html>
