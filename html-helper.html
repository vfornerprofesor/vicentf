<!DOCTYPE html>
<html>

<head>
    <style>
        /* Pantalla de carrega: evita el flaix de contingut sense estils
           mentre header.html (que porta tot el CSS/JS propi) encara no ha
           arribat. Colors en literal, no variables de general.css: eixe
           fitxer encara no ha carregat en este punt. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #6d5fb3;
            transition: opacity .3s ease;
        }
        #loading.vf-loading-hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .vf-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: vf-spin .8s linear infinite;
        }

        @keyframes vf-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    textarea {
      width: 100%;
    }

    button {
      margin-top: 10px;
    }
  </style>
</head>

<body>
    <div id="loading">
        <div class="vf-spinner"></div>
    </div>
    <script>
        // Xarxa de seguretat independent de header.html: si per qualsevol
        // motiu no arriba a carregar (CDN caiguda, error de xarxa...), no
        // ens quedem amb l'espera infinita.
        setTimeout(function () {
            var l = document.getElementById('loading');
            if (l) { l.style.display = 'none'; }
        }, 5000);
    </script>
  <textarea id="textarea1" rows="10"></textarea>
  <!--<button onclick="pegar()">BORRAR</button>
  <button onclick="modificarTexto()">MODIFICAR</button>
  <button onclick="copiarSegundoTexto()">COPIAR</button>-->
  <button onclick="procesar()">PROCESAR</button>
  <textarea id="textarea2" rows="10"></textarea>

  <script>
    

    function procesar() {
      document.getElementById('textarea1').value = '';
      document.getElementById('textarea2').value = '';
      navigator.clipboard.readText()
        .then(text => {
          console.log('Texto del portapapeles:', text);
          document.getElementById('textarea1').value = text;

          const textarea1 = document.getElementById('textarea1');
          const textarea2 = document.getElementById('textarea2');

          const contenido = textarea1.value;
          const contenidoModificado = contenido.replace(/</g, '&lt;').replace(/>/g, '&gt;');

          textarea2.value = contenidoModificado;

          navigator.clipboard.writeText(document.getElementById('textarea2').value);

        })
        .catch(err => {
          console.error('Error al leer del portapapeles:', err)
        });
    }

  </script>
</body>

</html>
