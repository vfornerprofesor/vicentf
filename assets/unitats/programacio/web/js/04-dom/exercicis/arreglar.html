<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        /* Pantalla de carrega: evita el flaix de contingut sense estils
           mentre header.html (que porta tot el CSS/JS propi) encara no ha
           arribat. Colors en literal, no variables de general.css: eixe
           fitxer encara no ha carregat en este punt. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #6d5fb3;
            transition: opacity .3s ease;
        }
        #loading.vf-loading-hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .vf-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: vf-spin .8s linear infinite;
        }

        @keyframes vf-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="loading">
        <div class="vf-spinner"></div>
    </div>
    <script>
        // Xarxa de seguretat independent de header.html: si per qualsevol
        // motiu no arriba a carregar (CDN caiguda, error de xarxa...), no
        // ens quedem amb l'espera infinita.
        setTimeout(function () {
            var l = document.getElementById('loading');
            if (l) { l.style.display = 'none'; }
        }, 5000);
    </script>
    <style>
        #caixa {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        #caixa>div {
            width: 40%;
            margin-inline: 5%;
            height: 40vh;
            line-height: 40vh;
            text-align: center;
            font-size: 50px;
            border-radius: 20px;
        }
    </style>
    <div id="caixa">
        <div id="roig" onclick="clickVerd()">Verd</div>
        <div id="blau" onclick="clickBlau()">Roig</div>
        <div id="blau" onclick="clickRoig()">Blau</div>
        <div id="groc" onclick="clickGroc()">Groc</div>
    </div>
    <script>
        function clickVerd() {
            let verd = document.getElementById('groc');
            verd.style.backgroundColor = 'blue';
        }

        function clickGroc() {
            let groc = document.getElementById('blau');
            groc.style.backgroundColor = 'red';
        }

        function clickRoig() {
            let roig = document.getElementById('verd');
            roig.style.backgroundColor = 'green';
        }

        function clickBlau() {
            let blau = document.getElementById('blau');
            blau.style.backgroundColor = 'red';
        }
    </script>


</body>

</html>
