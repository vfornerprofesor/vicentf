<!DOCTYPE html>
<html lang="ca">

<head>
    <style>
        /* Pantalla de carrega: evita el flaix de contingut sense estils
           mentre header.html (que porta tot el CSS/JS propi) encara no ha
           arribat. Colors en literal, no variables de general.css: eixe
           fitxer encara no ha carregat en este punt. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #6d5fb3;
            transition: opacity .3s ease;
        }
        #loading.vf-loading-hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .vf-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: vf-spin .8s linear infinite;
        }

        @keyframes vf-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvi de Color del Cercle</title>
    <link rel="stylesheet" href="estils.css">
</head>

<body>
    <div id="loading">
        <div class="vf-spinner"></div>
    </div>
    <script>
        // Xarxa de seguretat independent de header.html: si per qualsevol
        // motiu no arriba a carregar (CDN caiguda, error de xarxa...), no
        // ens quedem amb l'espera infinita.
        setTimeout(function () {
            var l = document.getElementById('loading');
            if (l) { l.style.display = 'none'; }
        }, 5000);
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 40px;
        }

        #contenidor-cercle {
            border: 5px solid #333;
            /* Marc per donar-li un aspecte de semàfor */
            padding: 10px;
            border-radius: 20px;
            margin-bottom: 30px;
            background-color: #555;
        }

        #cercle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            /* Això fa que sigui un cercle */
            background-color: green;
            /* Color inicial neutre (gris) */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s ease;
            /* Transició suau per l'efecte de canvi */
        }

        #botoCanviColor {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        #botoCanviColor:hover {
            background-color: #0056b3;
        }
    </style>
    <h1>Semàfor Interactiu</h1>

    <div id="contenidor-cercle">
        <div id="cercle"></div>
    </div>

    <button id="botoCanviColor">Canviar Color</button>

    <script>
        // L'alumnat ha de crear aquí la funció i la lògica per gestionar el clic del botó,
        // demanar el color i canviar l'estil del cercle amb ID 'cercle'.

        
    </script>

</body>

</html>
