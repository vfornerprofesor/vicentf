<div id="scrollToTopBtn" aria-hidden="true">↑</div>
<script>

  const scrollToTopBtn = document.getElementById('scrollToTopBtn');

  // Agrega un evento de clic al botón para hacer scroll hacia arriba
  scrollToTopBtn.addEventListener('click', function () {
    document.body.scrollTop = 0; // Para navegadores antiguos
    document.documentElement.scrollTop = 0; // Para navegadores modernos
  });

  // Muestra u oculta el botón según la posición de desplazamiento.
  // EN2: classe (animable) en lloc de display, i llindar mes alt (abans
  // apareixia quasi immediatament, a 20px de scroll).
  window.addEventListener('scroll', function () {
    const show = document.body.scrollTop > 400 || document.documentElement.scrollTop > 400;
    scrollToTopBtn.classList.toggle('is-visible', show);
  }, { passive: true });
</script>
