<!DOCTYPE html>
<html lang="es">

<head>
    <style>
        /* Pantalla de carrega: evita el flaix de contingut sense estils
           mentre header.html (que porta tot el CSS/JS propi) encara no ha
           arribat. Colors en literal, no variables de general.css: eixe
           fitxer encara no ha carregat en este punt. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #6d5fb3;
            transition: opacity .3s ease;
        }
        #loading.vf-loading-hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .vf-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: vf-spin .8s linear infinite;
        }

        @keyframes vf-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <base href="../../../../">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECTE</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

    <div id="header"></div>
    <script>$('#header').load('header.html');</script>

</head>

<body>
    <div id="loading">
        <div class="vf-spinner"></div>
    </div>
    <script>
        // Xarxa de seguretat independent de header.html: si per qualsevol
        // motiu no arriba a carregar (CDN caiguda, error de xarxa...), no
        // ens quedem amb l'espera infinita.
        setTimeout(function () {
            var l = document.getElementById('loading');
            if (l) { l.style.display = 'none'; }
        }, 5000);
    </script>

    <div id="menu"></div>
    <script>$('#menu').load('menu.html');</script>
    <div id="content">
        <vf-title level="1">
            PROJECTE
        </vf-title>

        <vf-content>
            <vf-text>Hem de preparar les pàgines d'inici de sessió, registre i la pàgina principal. Recorda que ha de ser responsive i adaptar-se al tipus de pantalla.</vf-text>
            <vf-row>
                <vf-col>
                    <vf-title level="3">Inici de sessió</vf-title>
                    <vf-img src="assets/unitats/programacio/web/css/projecte_login.png"></vf-img>
                </vf-col>
                <vf-col>
                    <vf-title level="3">Registre</vf-title>
                    <vf-img src="assets/unitats/programacio/web/css/projecte_signup.png"></vf-img>
                </vf-col>
            </vf-row>
            <vf-row>
                <vf-col>

                    <vf-title level="3">Pantalla principal en ordinador</vf-title>
                    <vf-img src="assets/unitats/programacio/web/css/projecte_main1.png"></vf-img>
                </vf-col>
                <vf-col>

                    <vf-title level="3">Panatlla principal en mòbil</vf-title>
                    <vf-img src="assets/unitats/programacio/web/css/projecte_main2.png"></vf-img>
                </vf-col>
            </vf-row>
        </vf-content>


    </div>
    <div id="footer"></div>
    <script>$('#footer').load('footer.html');</script>
    </div>


</body>

</html>
