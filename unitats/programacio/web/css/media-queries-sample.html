<!DOCTYPE html>
<html lang="es">

<head>
    <style>
        /* Pantalla de carrega: evita el flaix de contingut sense estils
           mentre header.html (que porta tot el CSS/JS propi) encara no ha
           arribat. Colors en literal, no variables de general.css: eixe
           fitxer encara no ha carregat en este punt. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #6d5fb3;
            transition: opacity .3s ease;
        }
        #loading.vf-loading-hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .vf-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: vf-spin .8s linear infinite;
        }

        @keyframes vf-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <base href="../../../../">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemple de media queries</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

    <div id="header"></div>
    <script>$('#header').load('header.html');</script>

</head>

<body>
    <div id="loading">
        <div class="vf-spinner"></div>
    </div>
    <script>
        // Xarxa de seguretat independent de header.html: si per qualsevol
        // motiu no arriba a carregar (CDN caiguda, error de xarxa...), no
        // ens quedem amb l'espera infinita.
        setTimeout(function () {
            var l = document.getElementById('loading');
            if (l) { l.style.display = 'none'; }
        }, 5000);
    </script>

    <div id="contenedor">
        <div id="uno">1</div>
        <div id="dos">2</div>
        <div id="tres">3</div>
    </div>

    <style>
        /* Computer styles */
        @media (min-width: 1024px) {
            #contenedor {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        /* Tablet styles */
        @media (min-width: 768px) and (max-width: 1023px) {
            #contenedor {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Phone styles */
        @media (max-width: 767px) {
            #contenedor {
                grid-template-columns: 1fr;
            }
        }

        #contenedor {
            margin: 10px;
            display: grid;
            border: 1px solid grey;
            padding: 10px;
        }

        #uno,
        #dos,
        #tres {
            width: 300px;
            height: 300px;
            padding: 5px;
            font-size: 50px;
            line-height: 300px;
            text-align: center;
            margin-inline: auto;
        }

        #uno {
            background-color: coral;
        }

        #dos {
            background-color: cadetblue;
        }

        #tres {
            background-color: lightgreen;
        }
    </style>

</body>

</html>
