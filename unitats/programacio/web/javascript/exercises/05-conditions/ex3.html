<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password check</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e8f4f8;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            max-width: 450px;
            text-align: center;
            border-top: 5px solid #007bff;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            background-color: #28a745;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1e7e34;
        }

        #result {
            margin-top: 30px;
            font-size: 1.1em;
            text-align: left;
            min-height: 25px;
            padding: 10px;
        }

        #result p {
            margin: 4px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Password check</h1>
        <p>Type a password. The page will show, one under the other, whether it has at
            least 8 characters, whether it has a number, and whether it has a capital
            letter.</p>

        <input type="text" id="password" placeholder="Type a password">

        <button id="checkButton">Check</button>

        <div id="result"></div>
    </div>

    <script>
        // Show a green tick or a red cross for each of the three checks:
        // length >= 8, has a number, has a capital letter.
    </script>
</body>

</html>
