<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Age check</h1>
        <p>Type your age and the page will say if you are a child, a teenager, an adult or a senior.</p>

        <input type="number" id="age" placeholder="Type your age">

        <button id="checkButton">Check</button>

        <p id="result"></p>
    </div>

    <script>
        // Show "Child", "Teenager", "Adult" or "Senior" in #result, each one
        // with a different colour. If the number is negative or over 120,
        // show an error message in red.
    </script>
</body>

</html>
