<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic light</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 40px;
        }

        #circle-container {
            border: 5px solid #333;
            padding: 10px;
            border-radius: 20px;
            margin-bottom: 30px;
            background-color: #555;
        }

        #circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: grey;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s ease;
        }

        .buttons button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 0 5px;
            transition: background-color 0.2s;
        }

        .buttons button:hover {
            background-color: #0056b3;
        }

        #message {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Interactive Traffic Light</h1>

    <div id="circle-container">
        <div id="circle"></div>
    </div>

    <div class="buttons">
        <button id="stopButton">Stop</button>
        <button id="waitButton">Wait</button>
        <button id="goButton">Go</button>
    </div>

    <p id="message"></p>

    <script>
        // Add here the click listener for each button: it must paint
        // #circle with the right colour and write a message in #message.
    </script>
</body>

</html>
