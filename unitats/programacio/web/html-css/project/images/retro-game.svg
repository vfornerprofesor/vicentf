<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" shape-rendering="crispEdges">
  <rect width="400" height="300" fill="#23272f"/>
  <!-- sky and ground -->
  <rect x="20" y="20" width="360" height="200" fill="#6fd3ff"/>
  <rect x="20" y="200" width="360" height="20" fill="#3f8a5c"/>
  <rect x="20" y="220" width="360" height="20" fill="#9c6b45"/>
  <!-- clouds -->
  <g fill="#fff"><rect x="60" y="50" width="60" height="16"/><rect x="72" y="40" width="30" height="10"/><rect x="260" y="70" width="70" height="16"/><rect x="276" y="60" width="34" height="10"/></g>
  <!-- blocks -->
  <g fill="#f2a541" stroke="#7d5434" stroke-width="3"><rect x="200" y="120" width="24" height="24"/><rect x="224" y="120" width="24" height="24"/><rect x="248" y="120" width="24" height="24"/></g>
  <!-- coins -->
  <g fill="#f2a541"><rect x="300" y="160" width="10" height="16"/><rect x="330" y="160" width="10" height="16"/><rect x="230" y="90" width="10" height="16"/></g>
  <!-- character -->
  <rect x="100" y="152" width="24" height="10" fill="#d96f4a"/>
  <rect x="100" y="162" width="24" height="14" fill="#f1c6a3"/>
  <rect x="116" y="166" width="4" height="4" fill="#23272f"/>
  <rect x="98" y="176" width="28" height="16" fill="#2d5a85"/>
  <rect x="100" y="192" width="8" height="8" fill="#7d5434"/>
  <rect x="116" y="192" width="8" height="8" fill="#7d5434"/>
  <!-- score -->
  <text x="30" y="270" font-family="monospace" font-size="20" fill="#f2a541">SCORE 001250</text>
  <text x="300" y="270" font-family="monospace" font-size="20" fill="#fff">x3</text>
</svg>
