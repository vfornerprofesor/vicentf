<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>List and table</title>
</head>

<body>
    <h1>List and table</h1>

    <h2>Topics</h2>
    <ul>
        <li>Frontend
            <ol>
                <li>HTML</li>
                <li>CSS</li>
            </ol>
        </li>
        <li>Backend
            <ol>
                <li>PHP</li>
                <li>SQL</li>
            </ol>
        </li>
        <li>Tools</li>
    </ul>

    <h2>Timetable</h2>
    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>08:00</th>
                <td>Web</td>
                <td>Networks</td>
                <td>Web</td>
            </tr>
            <tr>
                <td colspan="4">Break</td>
            </tr>
            <tr>
                <th>10:30</th>
                <td>Hardware</td>
                <td>Web</td>
                <td>Hardware</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
