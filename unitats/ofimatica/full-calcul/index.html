<!DOCTYPE html>
<html lang="es">

<head>
    <style>
        /* Pantalla de carrega: evita el flaix de contingut sense estils
           mentre header.html (que porta tot el CSS/JS propi) encara no ha
           arribat. Colors en literal, no variables de general.css: eixe
           fitxer encara no ha carregat en este punt. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #6d5fb3;
            transition: opacity .3s ease;
        }
        #loading.vf-loading-hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .vf-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: vf-spin .8s linear infinite;
        }

        @keyframes vf-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <base href="../../../">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full de càlcul</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

    <div id="header"></div>
    <script>$('#header').load('header.html');</script>

</head>

<body>
    <div id="loading">
        <div class="vf-spinner"></div>
    </div>
    <script>
        // Xarxa de seguretat independent de header.html: si per qualsevol
        // motiu no arriba a carregar (CDN caiguda, error de xarxa...), no
        // ens quedem amb l'espera infinita.
        setTimeout(function () {
            var l = document.getElementById('loading');
            if (l) { l.style.display = 'none'; }
        }, 5000);
    </script>

    <div id="menu"></div>
    <script>$('#menu').load('menu.html');</script>
    <div id="content">
        <vf-title level="1">
            Full de càlcul
        </vf-title>

        <vf-content>
            <vf-img src="assets/google_calcul.png" styles=""></vf-img>
            <vf-btn classes="btn-short"
                link="https://docs.google.com/spreadsheets/d/1NJ7wTmfxynSBcgT4GLI1PwgDQtt44b19GIDyHZQZkMM/edit?usp=sharing">FULL
                DE CÀLCUL A COPIAR</vf-btn>
        </vf-content>

        <vf-content>
            <vf-row>
                <vf-col classes="col-md-4 col-min-200px">
                    <vf-btn link="unitats/ofimatica/full-calcul/1-interficie.html">1. Interficie</vf-btn>
                </vf-col>
                <vf-col classes="col-md-4 col-min-200px">
                    <vf-btn link="unitats/ofimatica/full-calcul/2-format-calcul-basic.html">2. Format i càlcul
                        bàsic</vf-btn>
                </vf-col>
                <vf-col classes="col-md-4 col-min-200px">
                    <vf-btn link="unitats/ofimatica/full-calcul/3-calculs2.html">3. Càlculs II</vf-btn>
                </vf-col>
                <vf-col classes="col-md-4 col-min-200px">
                    <vf-btn link="unitats/ofimatica/full-calcul/4-calculs3.html">4. Càlculs III</vf-btn>
                </vf-col>
                <vf-col classes="col-md-4 col-min-200px">
                    <vf-btn link="unitats/ofimatica/full-calcul/5-condicionals.html">5. Condicionals</vf-btn>
                </vf-col>
                <vf-col classes="col-md-4 col-min-200px">
                    <vf-btn link="unitats/ofimatica/full-calcul/6-altres.html">6 - Altres formats i
                        filtres</vf-btn>
                </vf-col>
                <vf-col classes="col-md-4 col-min-200px">
                    <vf-btn link="unitats/ofimatica/full-calcul/7-funcions-estadistiques.html">7. Funcions
                        estadístiques</vf-btn>
                </vf-col>
            </vf-row>
        </vf-content>
        <vf-content>
            <vf-btn classes="btn-short" link="unitats/ofimatica/full-calcul/projecte.html">PROJECTE</vf-btn>
        </vf-content>


    </div>
    <div id="footer"></div>
    <script>$('#footer').load('footer.html');</script>
    </div>


</body>

</html>
