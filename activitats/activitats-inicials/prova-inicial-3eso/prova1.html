<!DOCTYPE html>
<html lang="es">

<head>
    <style>
        /* Pantalla de carrega: evita el flaix de contingut sense estils
           mentre header.html (que porta tot el CSS/JS propi) encara no ha
           arribat. Colors en literal, no variables de general.css: eixe
           fitxer encara no ha carregat en este punt. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #6d5fb3;
            transition: opacity .3s ease;
        }
        #loading.vf-loading-hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .vf-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: vf-spin .8s linear infinite;
        }

        @keyframes vf-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <base href="../../../">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova inicial 3r d'ESO - Prova 1</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

    <div id="header"></div>
    <script>$('#header').load('header.html');</script>

</head>

<body>
    <div id="loading">
        <div class="vf-spinner"></div>
    </div>
    <script>
        // Xarxa de seguretat independent de header.html: si per qualsevol
        // motiu no arriba a carregar (CDN caiguda, error de xarxa...), no
        // ens quedem amb l'espera infinita.
        setTimeout(function () {
            var l = document.getElementById('loading');
            if (l) { l.style.display = 'none'; }
        }, 5000);
    </script>

    <div id="menu"></div>
    <script>$('#menu').load('menu.html');</script>
    <div id="content">
        <vf-title level="1" subtitle="Prova 1 de 4" centered>
            Prova inicial 3r d'ESO
        </vf-title>

        <vf-content>
            <vf-text>Observa bé la imatge i resol el repte. Quan tingues la resposta, escriu-la ací baix
                per passar a la *prova següent*.</vf-text>

            <vf-img classes="vf-prova-img boxshadow" src="assets/activitats/provainicial_3eso_1.png"
                alt="Prova 1 de la prova inicial de 3r d'ESO"></vf-img>

            <div id="prova"></div>
            <script src="scripts/proves/create_prova.js"></script>
            <script>
                createProva({
                    solucio: 'ALGORISME',
                    seguent: 'activitats/activitats-inicials/prova-inicial-3eso/prova2.html'
                });
            </script>
        </vf-content>

    </div>
    <div id="footer"></div>
    <script>$('#footer').load('footer.html');</script>


</body>

</html>
