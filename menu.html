<script>
    // Marca l'enllaç actiu del menu (EN1): el primer tram del pathname es
    // sempre la seccio de primer nivell (index.html a l'arrel, o el nom
    // de la carpeta "unitats"/"cursos"/... des de qualsevol pagina
    // interna), independentment de la profunditat de <base href>.
    (function () {
        var parts = location.pathname.split('/').filter(Boolean);
        var here = parts[0] || 'index.html';
        document.querySelectorAll('#navbarNav .nav-link').forEach(function (link) {
            var target = link.getAttribute('data-nav');
            if (target === here) {
                link.classList.add('active');
                link.setAttribute('aria-current', 'page');
            }
        });
    })();
</script>
